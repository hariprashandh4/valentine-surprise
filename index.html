<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            overflow: hidden;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff4e8a;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #ffe6f0;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        h1, h2 {
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>
<body>

<div class="container">

    <!-- First Screen -->
    <div id="firstScreen">
        <h2>Hey Beautiful ❤️</h2>
        <button onclick="showQuestion()">Tap to Open Your Surprise</button>
    </div>

    <!-- Question Screen -->
    <div id="questionScreen" class="hidden">
        <h1>Will You Be My Valentine? 💖</h1>
        <button onclick="showFinal()">Yes 💖</button>
        <button onclick="showFinal()">Yes 😘</button>
    </div>

    <!-- Final Message -->
    <div id="finalMessage" class="hidden">
        <h1>Happy Valentine’s Day My Love 💕</h1>
        <p>
            From the day you came into my life,  
            everything became more beautiful.  
            You are my happiness, my peace,  
            and my forever. ❤️  
        </p>
        <h3>I Love You So Much 💍</h3>
    </div>

</div>

<script>
function showQuestion() {
    document.getElementById("firstScreen").classList.add("hidden");
    document.getElementById("questionScreen").classList.remove("hidden");
}

function showFinal() {
    document.getElementById("questionScreen").classList.add("hidden");
    document.getElementById("finalMessage").classList.remove("hidden");
}
</script>

</body>
</html>
