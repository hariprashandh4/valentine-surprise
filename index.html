<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            color: white;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(-45deg, #ff4e8a, #ff0066, #ff758c, #ff1493);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            animation: fadeIn 2s ease-in-out;
        }

        h1, h2, p {
            margin: 15px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff0066;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #ffe6f0;
            transform: scale(1.1);
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translate(-50%, -40%);}
            to {opacity: 1; transform: translate(-50%, -50%);}
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: rgba(255,255,255,0.6);
            animation: floatUp 6s linear infinite;
            font-size: 20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

    </style>
</head>
<body>

<div class="container">

    <!-- First Screen -->
    <div id="firstScreen">
        <h2>Hey Beautiful ❤️</h2>
        <button onclick="showQuestion()">Tap to Open Your Surprise</button>
    </div>

    <!-- Question Screen -->
    <div id="questionScreen" class="hidden">
        <h1>Will You Be My Valentine? 💖</h1>
        <button onclick="showFinal()">Yes 💖</button>
        <button onclick="showFinal()">Yes 😘</button>
    </div>

    <!-- Final Message -->
    <div id="finalMessage" class="hidden">
        <h1>Happy Valentine’s Day My Love 💕</h1>
        <p>
            From the day you came into my life,<br>
            everything became more beautiful.<br><br>
            You are my happiness, my peace,<br>
            and my forever. ❤️<br><br>
            I promise to stand by you,<br>
            today, tomorrow and always. 💍
        </p>
        <h2>I Love You So Much 💖</h2>
    </div>

</div>

<!-- Floating Hearts Script -->
<script>
function showQuestion() {
    document.getElementById("firstScreen").classList.add("hidden");
    document.getElementById("questionScreen").classList.remove("hidden");
}

function showFinal() {
    document.getElementById("questionScreen").classList.add("hidden");
    document.getElementById("finalMessage").classList.remove("hidden");
}

// Generate floating hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}, 500);
</script>

</body>
</html>
